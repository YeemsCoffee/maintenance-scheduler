<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Maintenance Scheduler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .login-help {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .change-title {
            font-size: 20px;
            color: #1f2937;
            margin-bottom: 8px;
            text-align: center;
        }

        .change-intro {
            margin: 0 0 20px;
        }

        .field-help {
            margin-top: 4px;
            text-align: left;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🔧 Maintenance Scheduler</h1>
            <p>Manage your maintenance tasks efficiently</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Login Form -->
        <div id="loginForm" class="form-section">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="text" id="loginEmail" required autocomplete="username" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn" id="loginBtn">Login</button>
            </form>
            <p class="login-help">Need an account or forgot your password? Ask an administrator.</p>
        </div>

        <!-- Set / Change Password Form -->
        <div id="changeForm" class="form-section">
            <h2 class="change-title" id="changeTitle">Set a new password</h2>
            <p class="login-help change-intro" id="changeIntro"></p>
            <form onsubmit="handleChangePassword(event)">
                <div class="form-group" id="currentPasswordGroup">
                    <label for="currentPassword">Current password</label>
                    <input type="password" id="currentPassword" required autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
                    <p class="login-help field-help">At least 8 characters</p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input type="password" id="confirmPassword" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn" id="changeBtn">Save password</button>
            </form>
            <p class="login-help"><a href="#" id="changeExitLink"></a></p>
        </div>
    </div>

    <script>
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSection(id) {
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // forced: signed in with a temporary password and must pick a new one.
        // knownPassword: the password just typed at login, so we don't ask for it twice.
        function showChangeForm(forced, knownPassword) {
            document.getElementById('changeTitle').textContent = forced ? 'Set a new password' : 'Change your password';
            document.getElementById('changeIntro').textContent = forced
                ? "You're signed in with a temporary password. Choose your own password to continue."
                : '';

            const current = document.getElementById('currentPassword');
            current.value = knownPassword || '';
            document.getElementById('currentPasswordGroup').style.display = knownPassword ? 'none' : 'block';

            const exitLink = document.getElementById('changeExitLink');
            exitLink.textContent = forced ? 'Log out' : 'Cancel';
            exitLink.onclick = async (e) => {
                e.preventDefault();
                if (forced) {
                    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
                    window.location.href = '/login.html';
                } else {
                    window.location.href = '/';
                }
            };

            showSection('changeForm');
            document.getElementById(knownPassword ? 'newPassword' : 'currentPassword').focus();
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideMessages();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.must_change_password) {
                    showChangeForm(true, password);
                } else if (response.ok) {
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        async function handleChangePassword(event) {
            event.preventDefault();
            hideMessages();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('changeBtn');

            if (newPassword !== confirmPassword) {
                showError('The new passwords do not match');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Saving...';

            try {
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
                });
                const data = await response.json();

                if (response.ok) {
                    showSuccess('Password saved! Redirecting...');
                    setTimeout(() => { window.location.href = '/'; }, 800);
                    return;
                }
                showError(data.message || data.error || 'Could not change password');
                // If the remembered current password was rejected, let them type it
                if (data.error === 'wrong_password') {
                    document.getElementById('currentPasswordGroup').style.display = 'block';
                }
            } catch (error) {
                console.error('Change password error:', error);
                showError('Connection error. Please try again.');
            }
            btn.disabled = false;
            btn.textContent = 'Save password';
        }

        // Decide which form to show: login, a forced password change, or a
        // voluntary change (Change Password button, /login.html?change=1)
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/auth/me', { credentials: 'include' });
                if (response.ok) {
                    const me = await response.json();
                    if (me.must_change_password) {
                        showChangeForm(true);
                        return;
                    }
                    if (new URLSearchParams(window.location.search).has('change')) {
                        showChangeForm(false);
                        return;
                    }
                    window.location.href = '/';
                    return;
                }
            } catch (error) {
                console.error('Session check failed:', error);
            }
            showSection('loginForm');
            document.getElementById('loginEmail').focus();
        });
    </script>
</body>
</html>
